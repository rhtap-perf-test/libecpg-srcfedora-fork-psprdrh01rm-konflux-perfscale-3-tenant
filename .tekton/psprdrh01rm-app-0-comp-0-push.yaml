---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: '{{ source_url }}?rev={{ revision }}'
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch
      == "main"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: psprdrh01rm-app-0
    appstudio.openshift.io/component: psprdrh01rm-app-0-comp-0
    pipelines.appstudio.openshift.io/type: build
  name: psprdrh01rm-app-0-comp-0-on-push
  namespace: konflux-perfscale-3-tenant
spec:
  params:
    - name: package-name
      value: libecpg
    - name: git-url
      value: "{{ source_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: target-branch
      value: "{{ target_branch }}"
    - name: ociStorage
      value: "quay.io/redhat-user-workloads/$(context.taskRun.namespace)/psprdrh01rm-app-0-comp-0:$(params.revision)"
    - name: build-platforms
      value:
        - localhost
        - linux/amd64
        - linux/arm64
    - name: build-architectures
      value:
        - aarch64
        - x86_64
    - name: strictArch
      value: "false"
    - name: self-ref-url
      value: "https://github.com/konflux-ci/rpmbuild-pipeline.git"
    - name: self-ref-revision
      value: e70b042324ab5ff61ae6bb52d73e3a64f6792e2f
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/konflux-ci/rpmbuild-pipeline.git
      - name: revision
        value: e70b042324ab5ff61ae6bb52d73e3a64f6792e2f
      - name: pathInRepo
        value: pipeline/build-rpm-package.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-psprdrh01rm-app-0-comp-0
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
